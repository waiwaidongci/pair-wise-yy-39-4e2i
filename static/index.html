<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大坝巡检、缺陷与应急管理</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem;margin-right:.5rem}</style></head><body><h1>大坝巡检、缺陷与应急管理</h1><p>安排巡检，记录渗流、位移、裂缝等缺陷并跟踪修复、复检和应急预案；两队夜巡断网作业，回网按任务号合并。</p><p>异常值比控制阈值越高，缺陷优先级越高；应急处置缺陷必须完成复检并记录证据后才能关闭。同一缺陷两边都改过时保留候选，复核前不能关闭或派发应急任务。</p><button onclick="loadItems()">缺陷列表</button><button onclick="loadTasks()">巡检任务</button><button onclick="loadCandidates()">待复核候选</button><button onclick="loadSnapshot()">续传快照</button><pre id="out">使用X-Actor和X-Role请求头调用接口，POST /api/sync 按请求号续传。</pre><script>
const out=document.getElementById('out');
async function get(path){const r=await fetch(path,{headers:{'X-Actor':'demo','X-Role':'viewer'}});out.textContent=JSON.stringify(await r.json(),null,2)}
function loadItems(){get('/api/items')}
function loadTasks(){get('/api/tasks')}
function loadCandidates(){get('/api/candidates?status=pending')}
function loadSnapshot(){get('/api/snapshot?after=0')}
</script></body></html>
